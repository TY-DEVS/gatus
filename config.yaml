storage:
  type: sqlite
  path: /data/data.db

endpoints:
  # =========================================================================
  # 1. PHYSICAL VPS CONNECTIVITY (ICMP PING)
  # =========================================================================
  - name: "VPS 1 - Infrastructure Ping"
    group: "Servers (ICMP)"
    url: "icmp://62.169.27.8"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: "VPS 2 - Demo & Mail Ping"
    group: "Servers (ICMP)"
    url: "icmp://161.97.83.45"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: "VPS 3 - Clients Production Ping"
    group: "Servers (ICMP)"
    url: "icmp://161.97.165.50"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  # =========================================================================
  # 2. SERVER REMOTE ACCESS (SSH PORTS)
  # =========================================================================
  - name: "VPS 1 - SSH Access (Port 4155)"
    group: "Servers Access (SSH)"
    url: "tcp://62.169.27.8:4155"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "VPS 2 - SSH Access (Port 22)"
    group: "Servers Access (SSH)"
    url: "tcp://161.97.83.45:22"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "VPS 3 - SSH Access (Port 4155)"
    group: "Servers Access (SSH)"
    url: "tcp://161.97.165.50:4155"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  # =========================================================================
  # 3. VPS 1 - CORE PLATFORM & INFRASTRUCTURE CONTAINERS
  # =========================================================================
  - name: "Coolify Management Panel"
    group: "VPS 1 - Infrastructure"
    url: "https://coolify.ty-dev.site"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: "Coolify Realtime WebSocket (Port 6001)"
    group: "VPS 1 - Infrastructure"
    url: "tcp://62.169.27.8:6001"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "Netdata Dashboard WebUI"
    group: "VPS 1 - Infrastructure"
    url: "https://netdata.ty-dev.site"
    interval: 2m
    headers:
      Authorization: "Basic YWRtaW46VHlEZXZAU2VjdXJlMjAyNiE="
    conditions:
      - "[STATUS] == 200"

  - name: "Netdata Agent Stream (Port 19999)"
    group: "VPS 1 - Infrastructure"
    url: "tcp://62.169.27.8:19999"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "TY-DEV Main Portal"
    group: "VPS 1 - Infrastructure"
    url: "https://ty-dev.site"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: "TY-DEV CRM Portal"
    group: "VPS 1 - Infrastructure"
    url: "https://app.ty-dev.site"
    interval: 2m
    conditions:
      - "[STATUS] == 200 || [STATUS] == 302"
      - "[CERTIFICATE_EXPIRATION] > 72h"
      - "[RESPONSE_TIME] < 2000"

  # =========================================================================
  # 4. VPS 2 - MAIL & APPLICATION CONTAINERS
  # =========================================================================
  - name: "Stalwart IMAPS (Port 993)"
    group: "VPS 2 - Mail & Apps"
    url: "tcp://161.97.83.45:993"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "Stalwart POP3S (Port 995)"
    group: "VPS 2 - Mail & Apps"
    url: "tcp://161.97.83.45:995"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "Stalwart Sieve Rules (Port 4190)"
    group: "VPS 2 - Mail & Apps"
    url: "tcp://161.97.83.45:4190"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "Application Container (Port 3000)"
    group: "VPS 2 - Mail & Apps"
    url: "tcp://161.97.83.45:3000"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  # =========================================================================
  # 5. VPS 3 - BACKEND & DATABASE CONTAINERS
  # =========================================================================
  - name: "PostgreSQL Database (Port 5641)"
    group: "VPS 3 - Backends & DBs"
    url: "tcp://161.97.165.50:5641"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "Redis Cache Container (Port 6666)"
    group: "VPS 3 - Backends & DBs"
    url: "tcp://161.97.165.50:6666"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "Admin Portal Service (Port 3012)"
    group: "VPS 3 - Backends & DBs"
    url: "tcp://161.97.165.50:3012"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "API Backend Service (Port 3013)"
    group: "VPS 3 - Backends & DBs"
    url: "tcp://161.97.165.50:3013"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "Client App Container (Port 3007)"
    group: "VPS 3 - Backends & DBs"
    url: "tcp://161.97.165.50:3007"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  # =========================================================================
  # 6. VPS 3 - PRODUCTION CLIENT WEBSITES & SSL HEALTH
  # =========================================================================
  - name: "Clean Auto Services"
    group: "VPS 3 - Client Websites (SSL & Speed)"
    url: "https://cleanautoservices.fr"
    interval: 3m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"
      - "[RESPONSE_TIME] < 2000"

  - name: "Luxury Car Transport 24"
    group: "VPS 3 - Client Websites (SSL & Speed)"
    url: "https://luxurycartransport24.com"
    interval: 3m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"
      - "[RESPONSE_TIME] < 2000"

