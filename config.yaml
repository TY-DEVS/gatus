endpoints:
  # =========================================================================
  # 1. PHYSICAL VPS CONNECTIVITY (ICMP PING)
  # =========================================================================
  - name: "VPS 1 - Infrastructure"
    group: "Servers"
    url: "icmp://62.169.27.8"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: "VPS 2 - Demo & Mail"
    group: "Servers"
    url: "icmp://161.97.83.45"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: "VPS 3 - Clients Production"
    group: "Servers"
    url: "icmp://161.97.165.50"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  # =========================================================================
  # 2. CORE PLATFORM & INFRASTRUCTURE SERVICES (VPS 1)
  # =========================================================================
  - name: "Coolify Management Panel"
    group: "VPS 1 - Infrastructure"
    url: "https://coolify.ty-dev.site"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: "Netdata Dashboard"
    group: "VPS 1 - Infrastructure"
    url: "https://netdata.ty-dev.site"
    interval: 2m
    conditions:
      - "[STATUS] == 200"

  - name: "TY-DEV Main Portal"
    group: "VPS 1 - Infrastructure"
    url: "https://ty-dev.site"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: "GrowCRM App"
    group: "VPS 1 - Infrastructure"
    url: "https://app.ty-dev.site"
    interval: 3m
    conditions:
      - "[STATUS] == 200"

  # =========================================================================
  # 3. MAIL INFRASTRUCTURE (VPS 2)
  # =========================================================================
  - name: "Stalwart Mail Web Admin"
    group: "VPS 2 - Mail Services"
    url: "https://mail.ty-dev.tech"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: "Stalwart SMTP Submission (Port 465)"
    group: "VPS 2 - Mail Services"
    url: "tcp://161.97.83.45:465"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: "Stalwart IMAPS (Port 993)"
    group: "VPS 2 - Mail Services"
    url: "tcp://161.97.83.45:993"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

